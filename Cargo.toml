[package]
name = "mdpkg"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Declarative multi-host package manager for Manjaro Linux via Markdown checklists"
repository = "https://github.com/MustD/mdpkg"
homepage = "https://github.com/MustD/mdpkg"
readme = "README.md"
keywords = ["manjaro", "pacman", "aur", "package-manager", "markdown"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
dialoguer = "0.11"
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
